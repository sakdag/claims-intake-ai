[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claims-intake-ai"
version = "0.1.0"
description = "AI claims intake for Elm & Stone Home Insurance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Serhat Hakki Akdag" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "orjson>=3.10",
  "python-dateutil>=2.9,<3",
  "tenacity>=8.3",
  "structlog>=24.1",
]

[project.optional-dependencies]
data = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "huggingface-hub>=0.24",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
aws = [
  "boto3>=1.35",
]
eval = [
  "claims-intake-ai[data]",
  "scikit-learn>=1.5",
  "rich>=13.7",
]
dev = [
  "claims-intake-ai[data,api,aws,eval]",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
claims-download-data = "claims_intake.scripts.download_data:main"
claims-derive-labels = "claims_intake.scripts.derive_ground_truth:main"
claims-eval = "claims_intake.scripts.run_eval:main"
claims-api = "claims_intake.api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_intake"]

[tool.hatch.build.targets.wheel.sources]
"src/claims_intake" = "claims_intake"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["claims_intake"]
