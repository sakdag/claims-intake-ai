<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1480" viewBox="0 0 860 1480" role="img" aria-label="Elm and Stone claims intake architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d5248"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a8b82"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#121a16" flood-opacity="0.09"/>
    </filter>
    <style>
      .title { font: 700 26px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #1b4a38; }
      .sub { font: 400 14px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #5c6b63; }
      .lane { font: 700 13px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #1b4a38; letter-spacing: 0.08em; }
      .h { font: 700 16px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #121a16; }
      .hw { font: 700 16px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #f4f7f5; }
      .s { font: 400 13px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #5c6b63; }
      .sw { font: 400 13px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #d5e4db; }
      .l { font: 600 12px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #3d5248; }
      .n { font: 400 12px 'IBM Plex Sans', Helvetica, Arial, sans-serif; fill: #5c6b63; }
    </style>
  </defs>

  <rect width="860" height="1480" fill="#f3f6f4"/>
  <text x="40" y="44" class="title">Elm &amp; Stone — claims intake</text>
  <text x="40" y="70" class="sub">AI prepares the case · adjuster decides · never auto-approve / auto-deny</text>

  <!-- Section: Ingest -->
  <rect x="40" y="100" width="780" height="250" rx="18" fill="#e8f0eb" stroke="#c7d7ce"/>
  <text x="60" y="130" class="lane">1 · INGEST</text>

  <g filter="url(#shadow)">
    <rect x="290" y="150" width="280" height="64" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="430" y="176" text-anchor="middle" class="h">Claim package JSON</text>
    <text x="430" y="198" text-anchor="middle" class="s">multi-document bundle</text>
  </g>
  <line x1="430" y1="214" x2="430" y2="236" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="290" y="236" width="280" height="64" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="430" y="262" text-anchor="middle" class="h">S3 inbox</text>
    <text x="430" y="284" text-anchor="middle" class="s">ObjectCreated</text>
  </g>
  <line x1="430" y1="300" x2="430" y2="322" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="290" y="322" width="280" height="56" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="430" y="355" text-anchor="middle" class="h">Starter Lambda → StartExecution</text>
  </g>

  <!-- Section: Pipeline -->
  <rect x="40" y="370" width="780" height="620" rx="18" fill="#ffffff" stroke="#d5ddd7" filter="url(#shadow)"/>
  <text x="60" y="400" class="lane">2 · STEP FUNCTIONS PIPELINE</text>

  <g filter="url(#shadow)">
    <rect x="255" y="430" width="350" height="64" rx="14" fill="#1b4a38"/>
    <text x="430" y="456" text-anchor="middle" class="hw">Ingest Lambda</text>
    <text x="430" y="478" text-anchor="middle" class="sw">idempotent case create</text>
  </g>
  <line x1="430" y1="494" x2="430" y2="520" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="255" y="520" width="350" height="72" rx="14" fill="#1b4a38"/>
    <text x="430" y="548" text-anchor="middle" class="hw">ProcessClaim Lambda</text>
    <text x="430" y="572" text-anchor="middle" class="sw">AI + rules + missing-doc draft</text>
  </g>

  <!-- Side cards for Bedrock / checks -->
  <g filter="url(#shadow)">
    <rect x="60" y="520" width="170" height="72" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="145" y="548" text-anchor="middle" class="h">Bedrock</text>
    <text x="145" y="570" text-anchor="middle" class="s">classify · extract</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="630" y="520" width="170" height="72" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="715" y="548" text-anchor="middle" class="h">Checks</text>
    <text x="715" y="570" text-anchor="middle" class="s">conflicts · gates</text>
  </g>
  <line x1="230" y1="556" x2="255" y2="556" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <line x1="605" y1="556" x2="630" y2="556" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>

  <line x1="430" y1="592" x2="430" y2="630" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="630" width="420" height="96" rx="16" fill="#9a6700"/>
    <text x="430" y="668" text-anchor="middle" class="hw">WaitForHumanReview</text>
    <text x="430" y="694" text-anchor="middle" class="sw">waitForTaskToken — workflow paused</text>
    <text x="430" y="714" text-anchor="middle" class="sw">until adjuster approves or rejects</text>
  </g>

  <line x1="430" y1="726" x2="430" y2="760" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>
  <text x="448" y="752" class="l">on approve</text>

  <g filter="url(#shadow)">
    <rect x="255" y="760" width="350" height="64" rx="14" fill="#1b4a38"/>
    <text x="430" y="786" text-anchor="middle" class="hw">SendOutboundEmail</text>
    <text x="430" y="808" text-anchor="middle" class="sw">Amazon SES (signed approval)</text>
  </g>
  <line x1="430" y1="824" x2="430" y2="852" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="255" y="852" width="350" height="64" rx="14" fill="#1b4a38"/>
    <text x="430" y="878" text-anchor="middle" class="hw">Finalize</text>
    <text x="430" y="900" text-anchor="middle" class="sw">case status → ready</text>
  </g>

  <!-- DynamoDB shared state -->
  <g filter="url(#shadow)">
    <rect x="220" y="940" width="420" height="64" rx="14" fill="#fff" stroke="#1b4a38" stroke-width="1.6"/>
    <text x="430" y="966" text-anchor="middle" class="h">DynamoDB — cases + audit</text>
    <text x="430" y="988" text-anchor="middle" class="s">written by pipeline &amp; review API</text>
  </g>
  <line x1="430" y1="916" x2="430" y2="940" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>

  <!-- Section: Adjuster -->
  <rect x="40" y="1030" width="780" height="360" rx="18" fill="#e8f0eb" stroke="#c7d7ce"/>
  <text x="60" y="1060" class="lane">3 · ADJUSTER REVIEW PATH</text>

  <g filter="url(#shadow)">
    <rect x="220" y="1085" width="420" height="64" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="430" y="1111" text-anchor="middle" class="h">React review console</text>
    <text x="430" y="1133" text-anchor="middle" class="s">queue · field workspace · decisions</text>
  </g>
  <line x1="430" y1="1149" x2="430" y2="1175" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="1175" width="300" height="64" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="240" y="1201" text-anchor="middle" class="h">Amazon Cognito</text>
    <text x="240" y="1223" text-anchor="middle" class="s">adjuster sign-in</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="1175" width="300" height="64" rx="14" fill="#fff" stroke="#d5ddd7"/>
    <text x="620" y="1201" text-anchor="middle" class="h">API Gateway</text>
    <text x="620" y="1223" text-anchor="middle" class="s">JWT authorizer</text>
  </g>
  <line x1="240" y1="1175" x2="320" y2="1149" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="5 4"/>
  <line x1="620" y1="1175" x2="520" y2="1149" stroke="#3d5248" stroke-width="2"/>
  <text x="640" y="1168" class="l">HTTPS + JWT</text>

  <line x1="620" y1="1239" x2="620" y2="1265" stroke="#3d5248" stroke-width="2.25"/>
  <line x1="430" y1="1265" x2="620" y2="1265" stroke="#3d5248" stroke-width="2.25"/>
  <line x1="430" y1="1265" x2="430" y2="1280" stroke="#3d5248" stroke-width="2.25" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="220" y="1280" width="420" height="72" rx="14" fill="#1b4a38"/>
    <text x="430" y="1308" text-anchor="middle" class="hw">Review API Lambda</text>
    <text x="430" y="1332" text-anchor="middle" class="sw">FastAPI / Mangum · corrections · approve/reject</text>
  </g>

  <!-- Callback to HITL -->
  <path d="M430 1352 C430 1388 160 1388 160 700" fill="none" stroke="#9a6700" stroke-width="2.25" marker-end="url(#arrowAccent)"/>
  <text x="72" y="1120" class="l" transform="rotate(-90 72 1120)">SendTaskSuccess / Failure</text>

  <text x="40" y="1455" class="n">eu-north-1 · Terraform · least-privilege IAM · model never decides claim outcome</text>
</svg>
