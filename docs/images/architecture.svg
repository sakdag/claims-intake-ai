<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1520" viewBox="0 0 800 1520" role="img" aria-label="Elm and Stone claims intake architecture">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3d5248"/>
    </marker>
    <marker id="arrMuted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#7a8b82"/>
    </marker>
    <marker id="arrAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#9a6700"/>
    </marker>
    <style>
      .title { font: 700 22px Helvetica, Arial, sans-serif; fill: #1b4a38; }
      .lane { font: 700 11px Helvetica, Arial, sans-serif; fill: #1b4a38; letter-spacing: 0.07em; }
      .h { font: 700 14px Helvetica, Arial, sans-serif; fill: #121a16; }
      .hw { font: 700 14px Helvetica, Arial, sans-serif; fill: #f4f7f5; }
      .s { font: 400 12px Helvetica, Arial, sans-serif; fill: #5c6b63; }
      .sw { font: 400 12px Helvetica, Arial, sans-serif; fill: #d0e0d7; }
      .l { font: 600 11px Helvetica, Arial, sans-serif; fill: #3d5248; }
    </style>
  </defs>

  <rect width="800" height="1520" fill="#f3f6f4"/>
  <text x="32" y="42" class="title">Elm &amp; Stone — claims intake</text>

  <rect x="32" y="68" width="736" height="300" rx="14" fill="#e8f0eb" stroke="#c5d5cb"/>
  <text x="52" y="94" class="lane">1 · INGEST</text>

  <rect x="70" y="116" width="280" height="56" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="210" y="139" text-anchor="middle" class="h">Inbound email</text>
  <text x="210" y="159" text-anchor="middle" class="s">claimant / broker + attachments</text>

  <rect x="450" y="116" width="280" height="56" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="590" y="139" text-anchor="middle" class="h">Structured package</text>
  <text x="590" y="159" text-anchor="middle" class="s">optional JSON / API upload</text>

  <line x1="210" y1="172" x2="210" y2="198" stroke="#3d5248" stroke-width="2"/>
  <line x1="590" y1="172" x2="590" y2="198" stroke="#3d5248" stroke-width="2"/>
  <line x1="210" y1="198" x2="590" y2="198" stroke="#3d5248" stroke-width="2"/>
  <line x1="400" y1="198" x2="400" y2="220" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="220" width="340" height="50" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="400" y="241" text-anchor="middle" class="h">SES inbound / mail intake</text>
  <text x="400" y="259" text-anchor="middle" class="s">parse email → claim package object</text>

  <line x1="400" y1="270" x2="400" y2="292" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="292" width="340" height="50" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="400" y="313" text-anchor="middle" class="h">S3 inbox</text>
  <text x="400" y="331" text-anchor="middle" class="s">ObjectCreated → Starter Lambda</text>

  <line x1="400" y1="368" x2="400" y2="392" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="32" y="392" width="736" height="540" rx="14" fill="#ffffff" stroke="#cfd9d3"/>
  <text x="52" y="418" class="lane">2 · STEP FUNCTIONS PIPELINE</text>

  <rect x="230" y="438" width="340" height="48" rx="10" fill="#1b4a38"/>
  <text x="400" y="467" text-anchor="middle" class="hw">Ingest Lambda · case create</text>

  <line x1="400" y1="486" x2="400" y2="510" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="52" y="510" width="150" height="56" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="127" y="533" text-anchor="middle" class="h">Bedrock</text>
  <text x="127" y="551" text-anchor="middle" class="s">classify · extract</text>

  <rect x="230" y="510" width="340" height="56" rx="10" fill="#1b4a38"/>
  <text x="400" y="533" text-anchor="middle" class="hw">ProcessClaim Lambda</text>
  <text x="400" y="551" text-anchor="middle" class="sw">AI + rules + draft email</text>

  <rect x="598" y="510" width="150" height="56" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="673" y="533" text-anchor="middle" class="h">Checks</text>
  <text x="673" y="551" text-anchor="middle" class="s">conflicts · gates</text>

  <line x1="202" y1="538" x2="230" y2="538" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrMuted)"/>
  <line x1="570" y1="538" x2="598" y2="538" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrMuted)"/>

  <line x1="400" y1="566" x2="400" y2="594" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="200" y="594" width="400" height="70" rx="12" fill="#9a6700"/>
  <text x="400" y="620" text-anchor="middle" class="hw">WaitForHumanReview</text>
  <text x="400" y="640" text-anchor="middle" class="sw">waitForTaskToken — paused for adjuster</text>
  <text x="400" y="656" text-anchor="middle" class="sw">until approve / reject</text>

  <line x1="400" y1="664" x2="400" y2="692" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>
  <text x="412" y="684" class="l">on approve</text>

  <rect x="230" y="692" width="340" height="48" rx="10" fill="#1b4a38"/>
  <text x="400" y="721" text-anchor="middle" class="hw">SendOutboundEmail · SES</text>

  <line x1="400" y1="740" x2="400" y2="764" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="764" width="340" height="48" rx="10" fill="#1b4a38"/>
  <text x="400" y="793" text-anchor="middle" class="hw">Finalize · case ready</text>

  <line x1="400" y1="812" x2="400" y2="840" stroke="#7a8b82" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arrMuted)"/>

  <rect x="230" y="840" width="340" height="48" rx="10" fill="#fff" stroke="#1b4a38" stroke-width="1.5"/>
  <text x="400" y="861" text-anchor="middle" class="h">DynamoDB — cases + audit</text>
  <text x="400" y="879" text-anchor="middle" class="s">shared by pipeline and review API</text>

  <line x1="400" y1="932" x2="400" y2="956" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="32" y="956" width="736" height="520" rx="14" fill="#e8f0eb" stroke="#c5d5cb"/>
  <text x="52" y="982" class="lane">3 · HOSTED ADJUSTER APP</text>

  <rect x="230" y="1004" width="340" height="50" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="400" y="1025" text-anchor="middle" class="h">CloudFront + S3</text>
  <text x="400" y="1043" text-anchor="middle" class="s">deployed React review SPA (HTTPS)</text>

  <line x1="400" y1="1054" x2="400" y2="1080" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="1080" width="340" height="50" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="400" y="1101" text-anchor="middle" class="h">Amazon Cognito</text>
  <text x="400" y="1119" text-anchor="middle" class="s">adjuster login · tokens</text>

  <line x1="400" y1="1130" x2="400" y2="1156" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="230" y="1156" width="340" height="50" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="400" y="1177" text-anchor="middle" class="h">API Gateway</text>
  <text x="400" y="1195" text-anchor="middle" class="s">JWT authorizer · review routes</text>

  <line x1="400" y1="1206" x2="400" y2="1232" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="200" y="1232" width="400" height="56" rx="10" fill="#1b4a38"/>
  <text x="400" y="1255" text-anchor="middle" class="hw">Review API Lambda (FastAPI / Mangum)</text>
  <text x="400" y="1275" text-anchor="middle" class="sw">queue · corrections · approve / reject</text>

  <line x1="400" y1="1288" x2="400" y2="1316" stroke="#9a6700" stroke-width="2" marker-end="url(#arrAccent)"/>

  <rect x="200" y="1316" width="400" height="56" rx="10" fill="#fff8e8" stroke="#d4a017"/>
  <text x="400" y="1339" text-anchor="middle" class="h">Resumes WaitForHumanReview</text>
  <text x="400" y="1359" text-anchor="middle" class="s">SendTaskSuccess / Failure → continue or close</text>

  <line x1="400" y1="1372" x2="400" y2="1396" stroke="#3d5248" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="200" y="1396" width="400" height="48" rx="10" fill="#fff" stroke="#cfd9d3"/>
  <text x="400" y="1417" text-anchor="middle" class="h">Outbound SES to claimant</text>
  <text x="400" y="1435" text-anchor="middle" class="s">missing-docs request after human approval only</text>
</svg>
